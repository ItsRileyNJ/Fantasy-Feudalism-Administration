name: Build and regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew check build runGameTestServer
      - uses: actions/upload-artifact@v4
        with:
          name: fantasy-feudalism-administration
          path: build/libs/*.jar
