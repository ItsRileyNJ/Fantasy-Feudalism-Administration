name: Build and regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (Linux)
        if: runner.os != 'Windows'
        run: ./gradlew check build runGameTestServer
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat check build runGameTestServer
      - uses: actions/upload-artifact@v4
        with:
          name: fantasy-feudalism-administration-${{ matrix.os }}
          path: build/libs/*.jar
